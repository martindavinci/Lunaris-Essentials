name: Lunaris Scanner CI

on:
  push:
    branches: [main]
    paths:
      - lunaris-scanner/**
      - .github/workflows/lunaris-scanner-*.yml
  pull_request:
    paths:
      - lunaris-scanner/**
      - .github/workflows/lunaris-scanner-*.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lunaris-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      # Signed with the debug key here: the release key is only handed to the release workflow.
      - name: Release build
        run: ./gradlew --no-daemon :app:assembleRelease
